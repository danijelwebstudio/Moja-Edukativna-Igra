<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vežba Pažnje</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #E3F2FD 0%, #F3E5F5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .menu-btn {
            padding: 4vmin 5vmin;
            font-size: 3.5vmin;
            font-weight: bold;
            background: white;
            color: #FF6B6B;
            border: 3px solid #FF6B6B;
            border-radius: 3vmin;
            cursor: pointer;
            box-shadow: 0 1.5vmin 3vmin rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            touch-action: manipulation;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }

        .menu-btn:hover {
            transform: translateY(-0.5vmin);
            box-shadow: 0 2vmin 4vmin rgba(0,0,0,0.25);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        h1 {
            color: #5E35B1;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .game-screen {
            display: none;
            flex-direction: column;
            gap: 25px;
        }

        .instruction-box {
            background: #FFF9C4;
            border: 3px solid #FBC02D;
            border-radius: 20px;
            padding: 25px;
            font-size: 1.3rem;
            color: #333;
            font-weight: bold;
            line-height: 1.6;
        }

        .score {
            font-size: 1.8rem;
            color: #5E35B1;
            font-weight: bold;
            padding: 15px;
            background: #E1BEE7;
            border-radius: 15px;
        }

        .feedback {
            font-size: 2rem;
            font-weight: bold;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5E35B1;
        }

        .choices {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .choice-btn {
            background: white;
            border: 4px solid #9575CD;
            border-radius: 20px;
            padding: 30px;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .choice-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .choice-btn:active {
            transform: scale(0.95);
        }

        .start-btn, .restart-btn {
            background: linear-gradient(135deg, #7E57C2 0%, #5E35B1 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 20px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(94, 53, 177, 0.3);
            transition: all 0.3s ease;
        }

        .start-btn:hover, .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(94, 53, 177, 0.4);
        }

        .start-btn:active, .restart-btn:active {
            transform: translateY(0);
        }

        .correct {
            animation: bounceCorrect 0.6s ease;
            border-color: #4CAF50 !important;
            background: #C8E6C9 !important;
        }

        .incorrect {
            animation: shake 0.5s ease;
            border-color: #F44336 !important;
            background: #FFCDD2 !important;
        }

        @keyframes bounceCorrect {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(0.95); }
            75% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .instruction-box {
                font-size: 1.1rem;
                padding: 20px;
            }

            .choice-btn {
                font-size: 3rem;
                padding: 25px;
            }

            .choices {
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Vežba Pažnje 🎮</h1>
        
        <div class="start-screen" id="startScreen">
            <div class="instruction-box">
                Dobrodošli! Slušaj zvukove pažljivo i klikni na tačnu sliku. Možeš li da povezaš zvuk sa slikom?
            </div>
            <button class="start-btn" id="startBtn">🚀 Započni igru</button>
        </div>

        <div class="game-screen" id="gameScreen">
            <div class="score" id="score">Poeni: 0</div>
            <div class="instruction-box" id="instructions"></div>
            <div class="feedback" id="feedback"></div>
            <div class="choices" id="choices"></div>
            <button class="restart-btn hidden" id="restartBtn">🔄 Nova igra</button>
            <a href="index.html" class="menu-btn link-btn">🔙 NAZAD NA IGRE</a>
        </div>
    </div>

    <script>
        let audioContext;
        let score = 0;
        let currentSound = null;
        let isProcessing = false;

        const soundMap = {
            'zvižduk': { emoji: '🚗', name: 'AUTO', freq: 800 },
            'zvono': { emoji: '🍎', name: 'JABUKU', freq: 600 },
            'bubanj': { emoji: '🐱', name: 'MAČKU', freq: 200 }
        };

        const sounds = Object.keys(soundMap);
        const emojis = Object.values(soundMap).map(v => v.emoji);

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(frequency, duration = 0.4, type = 'sine') {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = frequency;
            oscillator.type = type;

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playCorrectSound() {
            playSound(523.25, 0.2, 'sine');
            setTimeout(() => playSound(659.25, 0.2, 'sine'), 150);
        }

        function playGameSound(soundKey) {
            const soundData = soundMap[soundKey];
            if (soundKey === 'zvižduk') {
                playSound(soundData.freq, 0.3, 'sine');
                setTimeout(() => playSound(soundData.freq * 1.5, 0.3, 'sine'), 200);
            } else if (soundKey === 'zvono') {
                playSound(soundData.freq, 0.15, 'sine');
                setTimeout(() => playSound(soundData.freq, 0.15, 'sine'), 200);
                setTimeout(() => playSound(soundData.freq, 0.15, 'sine'), 400);
            } else {
                playSound(soundData.freq, 0.2, 'square');
            }
        }

        function startGame() {
            initAudio();
            score = 0;
            updateScore();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').style.display = 'flex';
            document.getElementById('restartBtn').classList.add('hidden');
            setupRound();
        }

        function setupRound() {
            isProcessing = false;
            currentSound = sounds[Math.floor(Math.random() * sounds.length)];
            
            const soundNames = {
                'zvižduk': 'ZVIŽDUK',
                'zvono': 'ZVONO',
                'bubanj': 'BUBANJ'
            };

            const targetName = soundMap[currentSound].name;
            document.getElementById('instructions').innerHTML = 
                `Kada čuješ <strong>${soundNames[currentSound]}</strong>, klikni na <strong>${targetName}</strong>!`;
            
            document.getElementById('feedback').textContent = '';
            
            const choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = '';
            
            const shuffled = [...emojis].sort(() => Math.random() - 0.5);
            
            shuffled.forEach(emoji => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = emoji;
                btn.onclick = () => handleChoice(emoji);
                choicesContainer.appendChild(btn);
            });

            setTimeout(() => {
                playGameSound(currentSound);
            }, 800);
        }

        function handleChoice(selectedEmoji) {
            if (isProcessing) return;
            isProcessing = true;

            const correctEmoji = soundMap[currentSound].emoji;
            const feedback = document.getElementById('feedback');
            const selectedBtn = Array.from(document.querySelectorAll('.choice-btn'))
                .find(btn => btn.textContent === selectedEmoji);

            if (selectedEmoji === correctEmoji) {
                selectedBtn.classList.add('correct');
                feedback.textContent = '🎉 Bravo! 🎉';
                feedback.style.color = '#4CAF50';
                playCorrectSound();
                score++;
                updateScore();

                setTimeout(() => {
                    selectedBtn.classList.remove('correct');
                    setupRound();
                }, 1500);
            } else {
                selectedBtn.classList.add('incorrect');
                feedback.textContent = '💪 Pokušaj ponovo!';
                feedback.style.color = '#F44336';

                setTimeout(() => {
                    selectedBtn.classList.remove('incorrect');
                    feedback.textContent = '';
                    isProcessing = false;
                }, 1000);
            }
        }

        function updateScore() {
            document.getElementById('score').textContent = `Poeni: ${score}`;
        }

        function restartGame() {
            startGame();
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', restartGame);
    </script>
</body>
</html>
