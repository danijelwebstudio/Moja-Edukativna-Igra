<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <title>Učim Reči - Latinica</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
            background: linear-gradient(135deg, #FFF9C4 0%, #FFF59D 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        h1 {
            font-size: 4vmin;
            color: #FF6B6B;
            margin: 1.5vmin 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            user-select: none;
            pointer-events: none;
        }

        .container {
            width: 95vw;
            max-width: 600px;
            height: 95vw;
            max-height: 600px;
            position: relative;
            touch-action: none;
        }

        @media (min-width: 601px) {
            .container {
                width: 80vw;
                height: 80vw;
            }
        }

        svg {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 3vmin;
            box-shadow: 0 1.5vmin 6vmin rgba(0,0,0,0.2);
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .track {
            fill: none;
            stroke: #E0E0E0;
            stroke-width: 80;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .fill {
            fill: none;
            stroke: #2196F3;
            stroke-width: 80;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .arrow {
            fill: white;
            opacity: 0.95;
            pointer-events: none;
        }

        .marker {
            fill: #2196F3;
            filter: drop-shadow(0 4px 8px rgba(33, 150, 243, 0.4));
            pointer-events: none;
        }

        .confetti {
            position: absolute;
            width: 12px;
            height: 12px;
            pointer-events: none;
        }

        .menu-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFF9C4 0%, #FFF59D 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
            touch-action: none;
            padding: 2vmin;
        }

        .menu-screen.hidden {
            display: none;
        }

        .menu-title {
            font-size: 6vmin;
            color: #FF6B6B;
            margin-bottom: 5vmin;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            user-select: none;
            pointer-events: none;
            text-align: center;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 2vmin;
            max-width: 900px;
            width: 100%;
            padding: 0 2vmin;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
                gap: 2vmin;
            }
            
            .menu-title {
                font-size: 8vmin;
                margin-bottom: 6vmin;
            }
        }

        .menu-btn {
            padding: 4vmin 5vmin;
            font-size: 3.5vmin;
            font-weight: bold;
            background: white;
            color: #FF6B6B;
            border: 3px solid #FF6B6B;
            border-radius: 3vmin;
            cursor: pointer;
            box-shadow: 0 1.5vmin 3vmin rgba(0,0,0,0.15);
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            touch-action: manipulation;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', sans-serif;
        }

        .menu-btn:hover {
            transform: translateY(-0.5vmin);
            box-shadow: 0 2vmin 4vmin rgba(0,0,0,0.25);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        .link-btn {
            text-decoration: none;
        }

        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4CAF50 0%, #81C784 100%);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
            touch-action: none;
            padding: 2vmin;
        }

        .success-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .success-emoji {
            font-size: 20vmin;
            animation: bounce 0.6s ease-in-out;
            user-select: none;
            pointer-events: none;
        }

        .success-word {
            font-size: 8vmin;
            color: white;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin-top: 3vmin;
            user-select: none;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .success-buttons {
            display: flex;
            gap: 3vmin;
            margin-top: 6vmin;
            flex-wrap: wrap;
            justify-content: center;
        }

        .success-btn {
            padding: 3vmin 6vmin;
            font-size: 3.5vmin;
            font-weight: bold;
            background: white;
            color: #4CAF50;
            border: none;
            border-radius: 8vmin;
            cursor: pointer;
            box-shadow: 0 1.5vmin 3vmin rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
            touch-action: manipulation;
            min-height: 60px;
        }

        .success-btn:active {
            transform: scale(0.95);
        }

        @media (max-width: 600px) {
            .success-emoji {
                font-size: 25vmin;
            }
            
            .success-word {
                font-size: 10vmin;
            }
            
            .success-btn {
                font-size: 4vmin;
                padding: 3.5vmin 7vmin;
            }
        }

        .progress {
            font-size: 3.5vmin;
            color: #FF6B6B;
            margin-top: 2vmin;
            font-weight: bold;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .progress {
                font-size: 4.5vmin;
            }
        }

        .game-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .game-screen.hidden {
            display: none;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="menu-screen" id="menuScreen">
        <div class="menu-title">Izaberi Reč 📚</div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startLesson(0)">👩 MAMA</button>
            <button class="menu-btn" onclick="startLesson(1)">👨 TATA</button>
            <button class="menu-btn" onclick="startLesson(2)">👁️ OKO</button>
            <button class="menu-btn" onclick="startLesson(3)">👵 BABA</button>
            <button class="menu-btn" onclick="startLesson(4)">🐕 PAS</button>
            <a href="index.html" class="menu-btn link-btn">🔙 NAZAD NA IGRE</a>
        </div>
    </div>

    <div class="game-screen hidden" id="gameScreen">
        <h1 id="letterTitle">Lekcija: MAMA</h1>
        <div class="container">
            <svg id="canvas" viewBox="0 0 600 600"></svg>
        </div>
        <div class="progress" id="progress">Slovo: M</div>
    </div>

    <div class="success-overlay" id="successOverlay">
        <div class="success-emoji" id="successEmoji">👩</div>
        <div class="success-word" id="successWord">MAMA</div>
        <div class="success-buttons">
            <button class="success-btn" onclick="backToMenu()">🏠 NAZAD</button>
            <button class="success-btn" onclick="nextLesson()">➡ DALJE</button>
        </div>
    </div>

    <script>
        const letterPaths = {
            M: {
                strokes: [
                    { path: 'M 150 450 L 150 150', arrows: [{x: 150, y: 280, angle: -90}] },
                    { path: 'M 150 150 L 300 350', arrows: [{x: 215, y: 235, angle: 50}] },
                    { path: 'M 300 350 L 450 150', arrows: [{x: 385, y: 235, angle: -50}] },
                    { path: 'M 450 150 L 450 450', arrows: [{x: 450, y: 280, angle: 90}] }
                ]
            },
            A: {
                strokes: [
                    { path: 'M 200 450 L 300 150', arrows: [{x: 245, y: 280, angle: -65}] },
                    { path: 'M 300 150 L 400 450', arrows: [{x: 355, y: 280, angle: 65}] },
                    { path: 'M 240 320 L 360 320', arrows: [{x: 300, y: 320, angle: 0}] }
                ]
            },
            T: {
                strokes: [
                    { path: 'M 200 150 L 400 150', arrows: [{x: 300, y: 150, angle: 0}] },
                    { path: 'M 300 150 L 300 450', arrows: [{x: 300, y: 280, angle: 90}] }
                ]
            },
            O: {
                strokes: [
                    { path: 'M 300 150 Q 450 150 450 300 Q 450 450 300 450 Q 150 450 150 300 Q 150 150 300 150', 
                      arrows: [{x: 380, y: 180, angle: 0}, {x: 380, y: 420, angle: 180}, {x: 220, y: 420, angle: 180}] }
                ]
            },
            K: {
                strokes: [
                    { path: 'M 200 150 L 200 450', arrows: [{x: 200, y: 280, angle: 90}] },
                    { path: 'M 450 150 L 200 300', arrows: [{x: 320, y: 220, angle: -135}] },
                    { path: 'M 200 300 L 450 450', arrows: [{x: 320, y: 380, angle: 45}] }
                ]
            },
            B: {
                strokes: [
                    { path: 'M 200 150 L 200 450', arrows: [{x: 200, y: 280, angle: 90}] },
                    { path: 'M 200 150 Q 370 150 370 225 Q 370 280 200 280', arrows: [{x: 285, y: 180, angle: 0}] },
                    { path: 'M 200 280 Q 390 280 390 365 Q 390 450 200 450', arrows: [{x: 295, y: 340, angle: 0}] }
                ]
            },
            P: {
                strokes: [
                    { path: 'M 200 450 L 200 150', arrows: [{x: 200, y: 280, angle: -90}] },
                    { path: 'M 200 150 Q 400 150 400 250 Q 400 320 200 320', arrows: [{x: 300, y: 190, angle: 0}] }
                ]
            },
            S: {
                strokes: [
                    { path: 'M 400 200 Q 350 150 250 180 Q 200 200 200 240 Q 200 280 300 300 Q 400 320 400 380 Q 400 420 350 445 Q 300 460 200 420', 
                      arrows: [{x: 320, y: 170, angle: 180}, {x: 350, y: 300, angle: 0}, {x: 280, y: 430, angle: 180}] }
                ]
            }
        };

        const lessons = [
            { name: 'MAMA', emoji: '👩', newLetters: ['M', 'A'], word: ['M', 'A', 'M', 'A'] },
            { name: 'TATA', emoji: '👨', newLetters: ['T'], word: ['T', 'A', 'T', 'A'] },
            { name: 'OKO', emoji: '👁️', newLetters: ['O', 'K'], word: ['O', 'K', 'O'] },
            { name: 'BABA', emoji: '👵', newLetters: ['B'], word: ['B', 'A', 'B', 'A'] },
            { name: 'PAS', emoji: '🐕', newLetters: ['P', 'S'], word: ['P', 'A', 'S'] }
        ];

        let currentLessonIndex = 0;
        let currentPhase = 'letter';
        let currentLetterIndex = 0;
        let currentWordLetterIndex = 0;
        let currentStrokeIndex = 0;
        let isDragging = false;
        let currentProgress = 0;
        let completedStrokes = [];

        const svg = document.getElementById('canvas');
        const letterTitle = document.getElementById('letterTitle');
        const progressText = document.getElementById('progress');
        const successOverlay = document.getElementById('successOverlay');
        const successEmoji = document.getElementById('successEmoji');
        const successWord = document.getElementById('successWord');
        const menuScreen = document.getElementById('menuScreen');
        const gameScreen = document.getElementById('gameScreen');

        let marker, pathElement, currentStrokeData;

        function startLesson(lessonIndex) {
            currentLessonIndex = lessonIndex;
            currentPhase = 'letter';
            currentLetterIndex = 0;
            currentWordLetterIndex = 0;
            
            menuScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            
            const lesson = lessons[lessonIndex];
            letterTitle.textContent = `Lekcija: ${lesson.name}`;
            
            loadNextLetterPhase();
        }

        function backToMenu() {
            successOverlay.classList.remove('show');
            gameScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        }

        function nextLesson() {
            successOverlay.classList.remove('show');
            
            currentLessonIndex++;
            if (currentLessonIndex >= lessons.length) {
                currentLessonIndex = 0;
            }
            
            startLesson(currentLessonIndex);
        }

        function loadNextLetterPhase() {
            const lesson = lessons[currentLessonIndex];
            
            if (currentLetterIndex >= lesson.newLetters.length) {
                currentPhase = 'word';
                currentWordLetterIndex = 0;
                loadNextWordLetter();
                return;
            }
            
            const letter = lesson.newLetters[currentLetterIndex];
            currentStrokeIndex = 0;
            completedStrokes = [];
            
            progressText.textContent = `Slovo: ${letter}`;
            loadStroke(letter);
        }

        function loadNextWordLetter() {
            const lesson = lessons[currentLessonIndex];
            
            if (currentWordLetterIndex >= lesson.word.length) {
                completeLesson();
                return;
            }
            
            const letter = lesson.word[currentWordLetterIndex];
            currentStrokeIndex = 0;
            completedStrokes = [];
            
            const wordProgress = lesson.word.slice(0, currentWordLetterIndex + 1).join('');
            progressText.textContent = `Reč: ${wordProgress}`;
            
            loadStroke(letter);
        }

        function loadStroke(letter) {
            svg.innerHTML = '';
            
            const letterData = letterPaths[letter];
            const stroke = letterData.strokes[currentStrokeIndex];
            currentStrokeData = parsePathToPoints(stroke.path);
            
            completedStrokes.forEach(completedPath => {
                const completed = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                completed.setAttribute('d', completedPath);
                completed.setAttribute('class', 'fill');
                svg.appendChild(completed);
            });
            
            const track = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            track.setAttribute('d', stroke.path);
            track.setAttribute('class', 'track');
            svg.appendChild(track);
            
            stroke.arrows.forEach(arrow => {
                const arrowGroup = createArrow(arrow.x, arrow.y, arrow.angle);
                svg.appendChild(arrowGroup);
            });
            
            pathElement = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pathElement.setAttribute('class', 'fill');
            pathElement.setAttribute('d', '');
            svg.appendChild(pathElement);
            
            const startPoint = currentStrokeData[0];
            marker = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            marker.setAttribute('class', 'marker');
            marker.setAttribute('cx', startPoint.x);
            marker.setAttribute('cy', startPoint.y);
            marker.setAttribute('r', '50');
            svg.appendChild(marker);
            
            currentProgress = 0;
            updateFillPath();
        }

        function parsePathToPoints(pathString) {
            const points = [];
            const commands = pathString.match(/[MLQC][^MLQC]*/g);
            let lastX = 0, lastY = 0;
            
            commands.forEach(cmd => {
                const type = cmd[0];
                const coords = cmd.slice(1).trim().split(/[\s,]+/).map(Number);
                
                if (type === 'M' || type === 'L') {
                    points.push({x: coords[0], y: coords[1]});
                    lastX = coords[0];
                    lastY = coords[1];
                } else if (type === 'Q') {
                    const cpX = coords[0], cpY = coords[1];
                    const endX = coords[2], endY = coords[3];
                    
                    for (let t = 0; t <= 1; t += 0.008) {
                        const x = (1-t)*(1-t)*lastX + 2*(1-t)*t*cpX + t*t*endX;
                        const y = (1-t)*(1-t)*lastY + 2*(1-t)*t*cpY + t*t*endY;
                        points.push({x, y});
                    }
                    lastX = endX;
                    lastY = endY;
                }
            });
            
            return points;
        }

        function createArrow(x, y, angle) {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', `translate(${x}, ${y}) rotate(${angle})`);
            
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', 'M -20 -15 L 20 0 L -20 15 Z');
            path.setAttribute('class', 'arrow');
            g.appendChild(path);
            
            return g;
        }

        function updateFillPath() {
            if (currentProgress <= 0) {
                pathElement.setAttribute('d', '');
                return;
            }
            
            const numPoints = Math.floor(currentProgress * (currentStrokeData.length - 1));
            const points = currentStrokeData.slice(0, Math.max(1, numPoints + 1));
            
            if (points.length === 0) {
                pathElement.setAttribute('d', '');
                return;
            }
            
            let pathD = `M ${points[0].x} ${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                pathD += ` L ${points[i].x} ${points[i].y}`;
            }
            
            pathElement.setAttribute('d', pathD);
        }

        function projectPointOnPath(x, y) {
            let minDist = Infinity;
            let closestIndex = 0;
            
            for (let i = 0; i < currentStrokeData.length; i++) {
                const point = currentStrokeData[i];
                const dist = Math.hypot(point.x - x, point.y - y);
                
                if (dist < minDist) {
                    minDist = dist;
                    closestIndex = i;
                }
            }
            
            return { index: closestIndex, distance: minDist };
        }

        function handlePointerDown(e) {
            e.preventDefault();
            e.stopPropagation();
            
            const rect = svg.getBoundingClientRect();
            const scaleX = 600 / rect.width;
            const scaleY = 600 / rect.height;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            
            const startPoint = currentStrokeData[0];
            const dist = Math.hypot(startPoint.x - x, startPoint.y - y);
            
            if (dist < 180) {
                isDragging = true;
            }
        }

        function handlePointerMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            e.stopPropagation();
            
            const rect = svg.getBoundingClientRect();
            const scaleX = 600 / rect.width;
            const scaleY = 600 / rect.height;
            
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            const x = (clientX - rect.left) * scaleX;
            const y = (clientY - rect.top) * scaleY;
            
            const result = projectPointOnPath(x, y);
            
            if (result.distance < 140) {
                const newProgress = result.index / (currentStrokeData.length - 1);
                
                if (newProgress >= currentProgress) {
                    currentProgress = newProgress;
                    updateFillPath();
                    
                    const currentPoint = currentStrokeData[result.index];
                    marker.setAttribute('cx', currentPoint.x);
                    marker.setAttribute('cy', currentPoint.y);
                }
            }
        }

        function handlePointerUp(e) {
            if (!isDragging) return;
            e.preventDefault();
            e.stopPropagation();
            
            isDragging = false;
            
            if (currentProgress >= 0.98) {
                completeStroke();
            }
        }

        function completeStroke() {
            createConfetti(10);
            
            const lesson = lessons[currentLessonIndex];
            const letter = currentPhase === 'letter' 
                ? lesson.newLetters[currentLetterIndex]
                : lesson.word[currentWordLetterIndex];
            
            const letterData = letterPaths[letter];
            completedStrokes.push(letterData.strokes[currentStrokeIndex].path);
            
            currentStrokeIndex++;
            
            if (currentStrokeIndex >= letterData.strokes.length) {
                if (currentPhase === 'letter') {
                    currentLetterIndex++;
                    setTimeout(() => loadNextLetterPhase(), 500);
                } else {
                    currentWordLetterIndex++;
                    setTimeout(() => loadNextWordLetter(), 500);
                }
            } else {
                setTimeout(() => loadStroke(letter), 300);
            }
        }

        function completeLesson() {
            const lesson = lessons[currentLessonIndex];
            successEmoji.textContent = lesson.emoji;
            successWord.textContent = lesson.name;
            
            createConfetti(70);
            successOverlay.classList.add('show');
        }

        function createConfetti(count) {
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.top = Math.random() * 100 + '%';
                confetti.style.background = ['#FF6B6B', '#4CAF50', '#2196F3', '#FFC107', '#9C27B0'][Math.floor(Math.random() * 5)];
                confetti.style.animation = `confettiFall ${1 + Math.random()}s ease-out forwards`;
                document.body.appendChild(confetti);
                
                setTimeout(() => confetti.remove(), 1500);
            }
        }

        svg.addEventListener('pointerdown', handlePointerDown);
        svg.addEventListener('pointermove', handlePointerMove);
        svg.addEventListener('pointerup', handlePointerUp);
        svg.addEventListener('pointercancel', handlePointerUp);
        svg.addEventListener('touchstart', handlePointerDown, { passive: false });
        svg.addEventListener('touchmove', handlePointerMove, { passive: false });
        svg.addEventListener('touchend', handlePointerUp, { passive: false });
        svg.addEventListener('touchcancel', handlePointerUp, { passive: false });
        svg.addEventListener('dragstart', e => e.preventDefault());

        document.addEventListener('touchmove', (e) => {
            if (isDragging) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
