<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Uči Ćirilicu — Prati potez prsta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7fbff; --card:#fff; --accent:#45b8ff; --accent2:#7ee0a8; --muted:#6b7a88;
    --ok:#8bd08a; --err:#ff7b8b; --radius:16px; --shadow: 0 14px 40px rgba(20,30,60,0.08);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:Inter,system-ui,Arial; background:linear-gradient(180deg,#eaf9ff 0%,#fbfdff 100%);
    display:flex; align-items:center; justify-content:center; padding:18px; color:#123;
  }
  .wrap{
    width:100%; max-width:980px; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .title{font-weight:800;font-size:20px;color:#0b3b57}
  .meta{color:var(--muted);font-weight:700}
  .board{background:linear-gradient(180deg,#ffffff,#f8ffff); padding:16px;border-radius:14px}
  .gentle-msg{
    min-height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;margin:8px 0 14px;padding:10px 14px;
    font-weight:700;font-size:15px;background:linear-gradient(90deg, rgba(69,184,255,0.08), rgba(126,224,168,0.04));color:#063;
    visibility:hidden;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s,visibility .18s
  }
  .gentle-msg.show{visibility:visible;opacity:1;transform:translateY(0)}
  .svg-wrap{width:100%;height:420px;border-radius:12px;overflow:hidden;touch-action:none;background:linear-gradient(180deg,rgba(96,197,255,0.03),rgba(139,208,138,0.02));display:flex;align-items:center;justify-content:center}
  svg{width:100%;height:100%;display:block}
  .stroke{fill:none; stroke:#dfeef6; stroke-width:36; stroke-linecap:round; stroke-linejoin:round; transition:stroke .14s, opacity .14s}
  .stroke.active{ stroke: var(--accent); opacity:1 }
  .stroke.error{ stroke: var(--err); opacity:0.95 }
  .stroke.complete{ stroke: var(--ok); opacity:0.95 }
  #marker{ fill:var(--accent); stroke:white; stroke-width:4; filter:drop-shadow(0 10px 24px rgba(0,0,0,0.12))}
  .start-ring{ fill:none; stroke:rgba(255,255,255,0.9); stroke-width:6; filter:drop-shadow(0 6px 12px rgba(0,0,0,0.06)); }
  .start-dot{ fill:var(--accent); stroke:white; stroke-width:3 }
  .controls{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  button{padding:10px 14px;border-radius:12px;border:1px solid rgba(30,40,60,0.06);background:var(--card);cursor:pointer;font-weight:800}
  button.primary{background:var(--accent);color:white;border:none;box-shadow:0 10px 24px rgba(69,184,255,0.12)}
  .note{margin-left:auto;color:var(--muted);font-size:13px}
  .word-image{width:84px;height:84px;border-radius:12px;background:linear-gradient(180deg,#fff,#f2fbff);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px rgba(0,0,0,0.06);margin-right:12px}
  .word-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .target-word{font-size:20px;font-weight:800;color:#034}
  @media (max-width:720px){ .svg-wrap{height:360px} .title{font-size:18px} .word-image{width:68px;height:68px} }
</style>
</head>
<body>
  <div class="wrap" role="main">
    <header>
      <div class="title">Uči Ćirilicu — Prati potez prsta</div>
      <div class="meta">Nivo: <strong id="levelLabel">1</strong> &nbsp; • &nbsp; Pokušaji: <strong id="triesLabel">0</strong></div>
    </header>

    <div class="board">
      <div class="word-row" aria-hidden="false">
        <div class="word-image" id="wordImage" aria-hidden="true">
          <div style="font-size:36px">🏠</div>
        </div>
        <div>
          <div class="target-word" id="targetWord">А</div>
          <div style="color:var(--muted);font-size:14px" id="hintText">Potezi: 1</div>
        </div>
      </div>

      <div id="gentleMsg" class="gentle-msg" aria-live="polite"></div>

      <div class="svg-wrap" id="svgWrap" aria-label="Prati potez">
        <svg id="gameSVG" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
          <!-- defs: arrow marker -->
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" opacity="0.95"/>
            </marker>
            <marker id="arrowAccent" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#045" opacity="0.9"/>
            </marker>
          </defs>
        </svg>
      </div>

      <div class="controls">
        <button id="btnRetry">Pokušaj ponovo</button>
        <button id="btnNext" class="primary" style="display:none">Sledeći</button>
        <div style="flex:1"></div>
        <div class="note">Dodirni i povuci — najbolje na telefonu</div>
      </div>
    </div>
  </div>

<script>
/* Poboljšana verzija trace-the-letter (više tolerancije, start rings, arrows on strokes,
   marker always snaps to correct start, mobile-first) */

(function(){
  // ==== levels: prilagođeno za bolju vizuelnu formu U i Ć (Ć kao C sa kvačicom)
  const levels = [
    { label: 'А', strokes: [
      "M200 380 L320 120",
      "M320 120 L440 380",
      "M255 250 L405 250"
    ], hint:"Пишемо А: лева коса, десна коса, пруга" },

    { label: 'Н', strokes: [
      "M200 120 L200 380",
      "M200 120 L440 380",
      "M440 120 L440 380"
    ], hint:"Пишемо Н: лева, коса, десна" },

    { label: 'У', strokes: [
      // oblik U sa repom (V i noga) - preciznije raspoređeno
      "M220 120 L360 300 L500 120",
      "M360 300 L360 380"
    ], hint:"Пишемо У: V облик па нога" },

    { label: 'Ћ', strokes: [
      // pojednostavljeni Ć: like C + small hook + accent tick
      "M220 140 C380 120, 420 340, 300 340", // glavni oblak
      "M300 340 L300 380", // noga
      "M245 110 L265 95"   // kvačica/akcent (mali potez gore)
    ], hint:"Пишемо Ћ: полукруг, нога, мали акценат" },

    // reč пример (primer) - primer kako rade složene reči
    { label: 'КУЋА', strokes: [
      "M80 120 L80 380", "M80 120 L220 250 L80 380", // К
      "M260 120 L360 320 L460 120", "M360 320 L360 380", // У
      "M520 120 L640 120 C640 120, 640 320, 520 320", "M520 320 L520 380", // Ћ (prilagodjeno)
      "M700 380 L780 120", "M780 120 L860 380", "M730 250 L840 250" // А
    ], hint:"Пиши реч: кућа - пратећи слова", imagePlaceholder:"🏠" }
  ];

  // DOM refs
  const svg = document.getElementById('gameSVG');
  const svgWrap = document.getElementById('svgWrap');
  const levelLabel = document.getElementById('levelLabel');
  const triesLabel = document.getElementById('triesLabel');
  const gentleMsg = document.getElementById('gentleMsg');
  const targetWordEl = document.getElementById('targetWord');
  const hintText = document.getElementById('hintText');
  const wordImage = document.getElementById('wordImage');
  const btnRetry = document.getElementById('btnRetry');
  const btnNext = document.getElementById('btnNext');

  // state
  let levelIndex = 0, tries = 0;
  let strokeEls = [], strokeSamples = [], pathLengths = [];
  let strokeIndex = 0, marker = null, markerPos = {x:0,y:0}, targetPos = {x:0,y:0};
  let isTracing = false, pointerId = null, currentT = 0;
  let startDots = []; // svg groups for start markers
  let slidOutWarn = false;
  let animationRunning = false;

  const HIT_TOL = 46;        // increased tolerance for users with motor challenges
  const HARD_FAIL = 120;     // if very far, we give firmer feedback but not instant reset
  const COMPLETE_PERC = 0.86; // percent to consider complete
  const STROKE_SAMPLE_STEP = 6;

  // helpers
  function createSVG(tag, attrs={}){ const el = document.createElementNS("http://www.w3.org/2000/svg", tag); for (let k in attrs) el.setAttribute(k, attrs[k]); return el; }
  function screenToSVGPoint(x,y){ const pt = svg.createSVGPoint(); pt.x = x; pt.y = y; const ctm = svg.getScreenCTM(); if(!ctm) return pt; return pt.matrixTransform(ctm.inverse()); }
  function showGentle(text, time=900){ gentleMsg.textContent = text; gentleMsg.className = 'gentle-msg show'; clearTimeout(gentleMsg._t); gentleMsg._t = setTimeout(()=> gentleMsg.className = 'gentle-msg', time); }

  // build level visuals
  function renderLevel(idx){
    // clear
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    strokeEls = []; strokeSamples = []; pathLengths = []; startDots = [];
    strokeIndex = 0; currentT = 0; slidOutWarn=false;

    // recreate defs (arrow markers)
    const defs = createSVG('defs', {});
    defs.innerHTML = `
      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#fff" opacity="0.96"/>
      </marker>
      <marker id="arrowAccent" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#045" opacity="0.96"/>
      </marker>
    `;
    svg.appendChild(defs);

    const level = levels[idx];
    levelLabel.textContent = idx+1;
    targetWordEl.textContent = level.label;
    hintText.textContent = level.hint || "";
    triesLabel.textContent = tries;

    if(level.imagePlaceholder){
      wordImage.innerHTML = `<div style="font-size:36px">${level.imagePlaceholder}</div>`;
    }

    // add each stroke path
    level.strokes.forEach((d,i)=>{
      const p = createSVG('path',{d, class:'stroke', 'data-idx':i, vectorEffect:'non-scaling-stroke'});
      // default arrow present but only visible on active via dynamic attribute
      svg.appendChild(p);
      strokeEls.push(p);
    });

    // marker circle
    marker = createSVG('circle',{id:'marker', r:14});
    svg.appendChild(marker);

    // compute lengths & samples & start markers
    requestAnimationFrame(()=> {
      strokeEls.forEach((p,i)=>{
        const L = p.getTotalLength();
        pathLengths[i] = L;
        const samples = [];
        const step = Math.max(0.8, Math.min(STROKE_SAMPLE_STEP, Math.floor(L/80)));
        for(let t=0;t<=L;t+=step){
          const pt = p.getPointAtLength(t);
          samples.push({t, x:pt.x, y:pt.y});
        }
        const pend = p.getPointAtLength(L);
        if(samples.length===0 || samples[samples.length-1].t < L) samples.push({t:L,x:pend.x,y:pend.y});
        strokeSamples[i] = samples;

        // create start ring & dot for each stroke (but show only current prominently)
        const s = p.getPointAtLength(0);
        const g = createSVG('g', {'data-start-for':i});
        const ring = createSVG('circle', {cx:s.x, cy:s.y, r:20, class:'start-ring', opacity: i===0 ? 1 : 0.18 });
        const dot = createSVG('circle', {cx:s.x, cy:s.y, r:8, class:'start-dot', opacity: i===0 ? 1 : 0.9});
        g.appendChild(ring); g.appendChild(dot);
        svg.appendChild(g);
        startDots.push({g, ring, dot});
      });

      // place marker at start of first stroke
      const s0 = strokeEls[0].getPointAtLength(0);
      markerPos.x = s0.x; markerPos.y = s0.y;
      marker.setAttribute('cx', markerPos.x); marker.setAttribute('cy', markerPos.y);
      targetPos.x = markerPos.x; targetPos.y = markerPos.y;
      updateStrokeVisuals();
      if(!animationRunning) animateMarker();
    });
  }

  function updateStrokeVisuals(){
    strokeEls.forEach((p,i)=>{
      p.classList.remove('active','error','complete');
      // remove marker-mid initially
      p.removeAttribute('marker-mid');
      p.style.opacity = 1;
      if(i === strokeIndex){
        p.classList.add('active');
        // show arrows on active stroke
        p.setAttribute('marker-mid', 'url(#arrow)');
        // highlight start visual
        startDots[i].ring.setAttribute('opacity', '1');
        startDots[i].dot.setAttribute('opacity', '1');
      } else if(i < strokeIndex){
        p.classList.add('complete');
        p.removeAttribute('marker-mid');
        startDots[i].ring.setAttribute('opacity','0.12');
        startDots[i].dot.setAttribute('opacity','0.9');
      } else {
        // future strokes subtle
        p.style.opacity = 0.9;
        startDots[i].ring.setAttribute('opacity','0.18');
        startDots[i].dot.setAttribute('opacity','0.9');
      }
    });
  }

  // find closest point on stroke using samples + local refine
  function closestOnStroke(idx, ptSVG){
    const samples = strokeSamples[idx];
    let bestIdx=0, best=Infinity;
    for(let i=0;i<samples.length;i++){
      const dx = samples[i].x - ptSVG.x;
      const dy = samples[i].y - ptSVG.y;
      const ds = dx*dx + dy*dy;
      if(ds < best){ best = ds; bestIdx = i; }
    }
    const L = pathLengths[idx];
    const refineStart = Math.max(0, samples[bestIdx].t - 20);
    const refineEnd = Math.min(L, samples[bestIdx].t + 20);
    let bestT = samples[bestIdx].t; let bestDs = best;
    for(let t=refineStart; t<=refineEnd; t+=1.2){
      const p = strokeEls[idx].getPointAtLength(t);
      const dx = p.x - ptSVG.x, dy = p.y - ptSVG.y;
      const ds = dx*dx + dy*dy;
      if(ds < bestDs){ bestDs = ds; bestT = t; }
    }
    const pb = strokeEls[idx].getPointAtLength(bestT);
    return { t: bestT, dist: Math.sqrt(bestDs), x: pb.x, y: pb.y };
  }

  // pointer handlers
  function onPointerDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    const pt = screenToSVGPoint(e.clientX, e.clientY);
    const start = strokeEls[strokeIndex].getPointAtLength(0);
    const dx = start.x - pt.x, dy = start.y - pt.y;
    const startDist = Math.hypot(dx,dy);
    const closest = closestOnStroke(strokeIndex, pt);

    // allow starting slightly along the stroke (first 18px) or near the start point
    if(startDist <= HIT_TOL || (closest.t <= 18 && closest.dist <= HIT_TOL + 8)){
      isTracing = true; pointerId = e.pointerId;
      currentT = Math.max(0, Math.min(closest.t, pathLengths[strokeIndex]*0.12)); // small snap to start
      targetPos.x = strokeEls[strokeIndex].getPointAtLength(currentT).x;
      targetPos.y = strokeEls[strokeIndex].getPointAtLength(currentT).y;
      strokeEls[strokeIndex].classList.remove('error'); strokeEls[strokeIndex].classList.add('active');
      try{ svg.setPointerCapture(pointerId); }catch(err){}
      showGentle('Прати стрелицу — полако и нежно',900);
      e.preventDefault();
    } else {
      showGentle('Почни на пла̀вом месту (где стоји круг)',900);
    }
  }

  function onPointerMove(e){
    if(!isTracing) return;
    if(pointerId !== null && e.pointerId !== pointerId) return;

    const pt = screenToSVGPoint(e.clientX, e.clientY);
    const closest = closestOnStroke(strokeIndex, pt);

    // if quite far -> gentle nudge (don't hard reset); allow some recovery
    if(closest.dist > HARD_FAIL){
      // user is way off: give clearer hint and slowly slide marker back towards stroke start
      strokeEls[strokeIndex].classList.add('error');
      if(!slidOutWarn) showGentle('Скренуо/ла си далеко — врати се на плаву линију полако',1100);
      slidOutWarn = true;
      // nudge currentT slightly back so they re-do a bit
      currentT = Math.max(0, currentT - 12);
      const pback = strokeEls[strokeIndex].getPointAtLength(currentT);
      targetPos.x = pback.x; targetPos.y = pback.y;
      return;
    }

    // normal: if within tolerance, allow progress; if slightly outside, allow but slower
    if(closest.dist <= HIT_TOL + 8){
      // allow forward progress (only small backward allowance)
      if(closest.t >= currentT - 3){
        currentT = closest.t;
        targetPos.x = closest.x; targetPos.y = closest.y;
      } else {
        // small backward - do not penalize; give hint
        targetPos.x = closest.x; targetPos.y = closest.y;
      }
      strokeEls[strokeIndex].classList.remove('error');
      slidOutWarn = false;
    } else {
      // slight slip: mark subtle error and nudge back (no hard reset)
      strokeEls[strokeIndex].classList.add('error');
      if(!slidOutWarn) showGentle('Мало си скренуо/ла — врати се на црту',900);
      slidOutWarn = true;
      // gently pull marker to the nearest point on stroke
      targetPos.x = closest.x; targetPos.y = closest.y;
      // step back a bit in progress so they cover small part again
      currentT = Math.max(0, closest.t - 8);
    }

    // check completion
    if(currentT >= pathLengths[strokeIndex] * COMPLETE_PERC){
      isTracing = false;
      try{ svg.releasePointerCapture(pointerId); }catch(err){}
      const pend = strokeEls[strokeIndex].getPointAtLength(pathLengths[strokeIndex]);
      targetPos.x = pend.x; targetPos.y = pend.y;
      // mark complete visually
      strokeEls[strokeIndex].classList.remove('active'); strokeEls[strokeIndex].classList.add('complete');
      // next stroke
      strokeIndex++;
      if(strokeIndex >= strokeEls.length){
        levelComplete();
      } else {
        // update visuals for next stroke
        setTimeout(()=>{ updateStrokeVisuals(); showGentle('Супер! Следећи потез',700); }, 220);
      }
    }
    e.preventDefault();
  }

  function onPointerUp(e){
    if(!isTracing) return;
    if(pointerId !== null && e.pointerId !== pointerId) return;
    // if lifted too early (didn't reach completion), give hint but do not hard reset
    if(currentT < pathLengths[strokeIndex] * COMPLETE_PERC){
      showGentle('Подигли сте прст пре краја — наставите од почетка овог потеза',1000);
      // gently snap marker back to start for this stroke segment
      const s = strokeEls[strokeIndex].getPointAtLength(0);
      targetPos.x = s.x; targetPos.y = s.y;
      currentT = 0;
      tries++; triesLabel.textContent = tries;
    }
    isTracing = false;
    try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
  }

  function levelComplete(){
    showGentle('Браво! Ниво завршен',1400);
    btnNext.style.display = 'inline-block';
    // small celebration: highlight all strokes as complete
    strokeEls.forEach(p=> { p.classList.remove('active'); p.classList.add('complete'); p.removeAttribute('marker-mid'); });
  }

  // animation
  function animateMarker(){
    if(!marker) { animationRunning=false; return; }
    animationRunning = true;
    const ease = 0.18;
    (function frame(){
      markerPos.x += (targetPos.x - markerPos.x) * ease;
      markerPos.y += (targetPos.y - markerPos.y) * ease;
      marker.setAttribute('cx', markerPos.x);
      marker.setAttribute('cy', markerPos.y);
      requestAnimationFrame(frame);
    })();
  }

  // buttons
  btnRetry.addEventListener('click', () => {
    tries++; triesLabel.textContent = tries;
    renderLevel(levelIndex);
    btnNext.style.display='none';
    showGentle('Ниво је ресетован',900);
  });
  btnNext.addEventListener('click', () => {
    levelIndex++;
    if(levelIndex >= levels.length) levelIndex = 0;
    renderLevel(levelIndex);
    btnNext.style.display='none';
    showGentle('Нови ниво',700);
  });

  // pointer listeners on wrapper (better hit area on mobile)
  svgWrap.addEventListener('pointerdown', onPointerDown);
  svgWrap.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);

  // init
  function init(){ renderLevel(levelIndex); animateMarker(); }
  init();

})();
</script>
</body>
</html>
