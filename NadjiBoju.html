<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prati Boju - Trening Pažnje</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .kontejner-igre {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.98);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
        }

        .zaglavlje {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .uputstvo {
            color: #555;
            font-size: 1.4em;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .prikaz-ciljne-boje {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 25px;
            border-radius: 15px;
            margin: 25px 0;
            text-align: center;
            border: 4px solid #667eea;
        }

        .tekst-ciljne-boje {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .uzorak-ciljne-boje {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto;
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .tabla-rezultata {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stavka-rezultata {
            text-align: center;
            flex: 1;
            min-width: 130px;
        }

        .labela-rezultata {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .vrednost-rezultata {
            font-size: 2.8em;
            font-weight: bold;
            color: #333;
        }

        .vrednost-rezultata.tacno {
            color: #28a745;
        }

        .vrednost-rezultata.pogresno {
            color: #dc3545;
        }

        .oblast-igre {
            position: relative;
            width: 100%;
            min-height: 450px;
            background: #f0f0f0;
            border-radius: 20px;
            border: 5px solid #ddd;
            overflow: hidden;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .glavni-kvadrat {
            width: 350px;
            height: 350px;
            border-radius: 20px;
            transition: background-color 0.6s ease, transform 0.2s ease;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            border: 8px solid #fff;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4em;
            user-select: none;
        }

        .glavni-kvadrat:hover {
            transform: scale(1.02);
        }

        .glavni-kvadrat:active {
            transform: scale(0.98);
        }

        .glavni-kvadrat.animacija-tacno {
            animation: animacijaTacno 0.5s ease;
        }

        .glavni-kvadrat.animacija-pogresno {
            animation: animacijaPogresno 0.5s ease;
        }

        @keyframes animacijaTacno {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1) rotate(5deg); }
            75% { transform: scale(1.1) rotate(-5deg); }
        }

        @keyframes animacijaPogresno {
            0%, 100% { transform: scale(1); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .povratna-informacija {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5em;
            font-weight: bold;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.6);
        }

        .povratna-informacija.prikazi {
            opacity: 1;
        }

        .povratna-informacija.tacno {
            color: #28a745;
        }

        .povratna-informacija.pogresno {
            color: #dc3545;
        }

        .poruka-statusa {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            min-height: 45px;
            margin-bottom: 20px;
            padding: 18px;
            background: #fff;
            border-radius: 12px;
            border: 3px solid #ddd;
            line-height: 1.4;
        }

        .dugme-resetuj {
            display: block;
            margin: 0 auto;
            padding: 16px 45px;
            font-size: 1.4em;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .dugme-resetuj:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
        }

        .dugme-resetuj:active {
            transform: translateY(0);
        }

        .dugme-nova-igra {
    display: block;
    margin: 15px auto 0;
    padding: 16px 45px;
    font-size: 1.4em;
    font-weight: bold;
    color: #fff;
    background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.dugme-nova-igra:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
}

.dugme-nova-igra:active {
    transform: translateY(0);
}

@media (max-width: 768px) {
    .dugme-nova-igra {
        font-size: 1.2em;
        padding: 14px 35px;
        margin-top: 12px;
    }
}

@media (max-width: 480px) {
    .dugme-nova-igra {
        font-size: 1.1em;
        padding: 12px 30px;
        margin-top: 10px;
    }
}

        @media (max-width: 768px) {
            .kontejner-igre {
                padding: 25px;
            }

            h1 {
                font-size: 2.3em;
            }

            .uputstvo {
                font-size: 1.2em;
            }

            .tekst-ciljne-boje {
                font-size: 1.5em;
            }

            .uzorak-ciljne-boje {
                width: 90px;
                height: 90px;
            }

            .oblast-igre {
                min-height: 380px;
                padding: 30px;
            }

            .glavni-kvadrat {
                width: 280px;
                height: 280px;
                font-size: 3em;
            }

            .vrednost-rezultata {
                font-size: 2.3em;
            }

            .povratna-informacija {
                font-size: 3.5em;
            }

            .poruka-statusa {
                font-size: 1.3em;
            }

            .dugme-resetuj {
                font-size: 1.2em;
                padding: 14px 35px;
            }
        }

        @media (max-width: 480px) {
            .kontejner-igre {
                padding: 20px;
            }

            h1 {
                font-size: 1.9em;
            }

            .uputstvo {
                font-size: 1.1em;
            }

            .tekst-ciljne-boje {
                font-size: 1.3em;
            }

            .uzorak-ciljne-boje {
                width: 75px;
                height: 75px;
            }

            .oblast-igre {
                min-height: 320px;
                padding: 20px;
            }

            .glavni-kvadrat {
                width: 220px;
                height: 220px;
                font-size: 2.5em;
                border: 6px solid #fff;
            }

            .vrednost-rezultata {
                font-size: 2em;
            }

            .tabla-rezultata {
                padding: 18px;
            }

            .stavka-rezultata {
                min-width: 100px;
            }

            .labela-rezultata {
                font-size: 1em;
            }

            .povratna-informacija {
                font-size: 2.8em;
            }

            .poruka-statusa {
                font-size: 1.1em;
                padding: 15px;
            }

            .dugme-resetuj {
                font-size: 1.1em;
                padding: 12px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="kontejner-igre">
        <div class="zaglavlje">
            <h1>🎯 Prati Boju</h1>
            <p class="uputstvo">Klikni na kvadrat samo kada se pojavi ciljna boja!</p>
        </div>

        <div class="prikaz-ciljne-boje">
            <div class="tekst-ciljne-boje">Prati boju: <span id="imeCiljneBoje"></span></div>
            <div class="uzorak-ciljne-boje" id="uzorakciljneBoje"></div>
        </div>

        <div class="tabla-rezultata">
            <div class="stavka-rezultata">
                <div class="labela-rezultata">Tačno</div>
                <div class="vrednost-rezultata tacno" id="tacniRezultat">0</div>
            </div>
            <div class="stavka-rezultata">
                <div class="labela-rezultata">Pogrešno</div>
                <div class="vrednost-rezultata pogresno" id="pogresniRezultat">0</div>
            </div>
            <div class="stavka-rezultata">
                <div class="labela-rezultata">Ukupno</div>
                <div class="vrednost-rezultata" id="ukupanRezultat">0</div>
            </div>
        </div>

        <div class="oblast-igre">
            <div class="glavni-kvadrat" id="glavniKvadrat">🎨</div>
            <div class="povratna-informacija" id="povratnaInformacija"></div>
        </div>

        <div class="poruka-statusa" id="porukaStatusa">Prati kvadrat i čekaj ciljnu boju!</div>

        <button class="dugme-resetuj" id="dugmeResetuj">🔄 Resetuj Igru</button>
        <button class="dugme-nova-igra" id="dugmeNovaIgra">🎲 Izaberi Novu Igru</button>
    </div>

    <script>
        // Definicija svih dostupnih boja
        // Definicija svih dostupnih boja
const sveBoje = [
    { ime: 'CRVENA', vrednost: '#FF0000' },
    { ime: 'PLAVA', vrednost: '#3498DB' },
    { ime: 'ZELENA', vrednost: '#00FF00' }, // <-- ISPRAVLJENO
    { ime: 'ŽUTA', vrednost: '#FFF200' },
    { ime: 'LJUBIČASTA', vrednost: '#7E16B8' },
    { ime: 'NARANDŽASTA', vrednost: '#E67E22' },
    { ime: 'ROZE', vrednost: '#D91076' },
];

// ... ostatak koda je nepromenjen

        // Promenljive za stanje igre
        let ciljnaBoja = null;
        let trenutnaBoja = null;
        let brojTacnih = 0;
        let brojPogresnih = 0;
        let intervalPromeneBoje = null;

        // DOM elementi
        const glavniKvadrat = document.getElementById('glavniKvadrat');
        const povratnaInformacija = document.getElementById('povratnaInformacija');
        const tacniRezultat = document.getElementById('tacniRezultat');
        const pogresniRezultat = document.getElementById('pogresniRezultat');
        const ukupanRezultat = document.getElementById('ukupanRezultat');
        const porukaStatusa = document.getElementById('porukaStatusa');
        const dugmeResetuj = document.getElementById('dugmeResetuj');
        const uzorakciljneBoje = document.getElementById('uzorakciljneBoje');
        const imeCiljneBoje = document.getElementById('imeCiljneBoje');

        // Funkcija za dobijanje slučajnog elementa iz niza
        function slucajniElement(niz) {
            const slucajniIndeks = Math.floor(Math.random() * niz.length);
            return niz[slucajniIndeks];
        }

        // Funkcija za dobijanje slučajne boje različite od trenutne
        function slucajnaBoja(osimBoje) {
            let novaBoja;
            do {
                novaBoja = slucajniElement(sveBoje);
            } while (osimBoje && novaBoja.ime === osimBoje.ime);
            return novaBoja;
        }

        // Funkcija za slučajno vreme između 2000ms i 3500ms
        function slucajnoVreme() {
            return Math.floor(Math.random() * 500) + 1000;
        }

        // Inicijalizacija igre
        function inicirajIgru() {
            // Nasumično izaberi ciljnu boju
            ciljnaBoja = slucajniElement(sveBoje);
            
            // Prikaži ciljnu boju
            uzorakciljneBoje.style.backgroundColor = ciljnaBoja.vrednost;
            imeCiljneBoje.textContent = ciljnaBoja.ime;
            
            // Postavi početnu boju (različitu od ciljne)
            trenutnaBoja = slucajnaBoja(ciljnaBoja);
            glavniKvadrat.style.backgroundColor = trenutnaBoja.vrednost;
            
            // Pokreni promenu boja
            pocniPromehuBoja();
        }

        // Pokreni nasumičnu promenu boja
        function pocniPromehuBoja() {
            function promeniBogu() {
                // Izaberi nasumičnu novu boju (različitu od trenutne)
                trenutnaBoja = slucajnaBoja(trenutnaBoja);
                glavniKvadrat.style.backgroundColor = trenutnaBoja.vrednost;
                
                // Zakaži sledeću promenu sa nasumičnim vremenom
                intervalPromeneBoje = setTimeout(promeniBogu, slucajnoVreme());
            }
            
            // Prva promena nakon nasumičnog vremena
            intervalPromeneBoje = setTimeout(promeniBogu, slucajnoVreme());
        }

        // Zaustavi promenu boja
        function zaustariPromehuBoja() {
            if (intervalPromeneBoje) {
                clearTimeout(intervalPromeneBoje);
                intervalPromeneBoje = null;
            }
        }

        // Proveri da li je kliknuta ciljna boja
        function proveriKlik() {
            if (trenutnaBoja.ime === ciljnaBoja.ime) {
                // Tačan odgovor
                brojTacnih++;
                tacniRezultat.textContent = brojTacnih;
                ukupanRezultat.textContent = brojTacnih - brojPogresnih;
                prikaziPovratnuInformaciju('✓ BRAVO!', 'tacno');
                glavniKvadrat.classList.add('animacija-tacno');
                porukaStatusa.textContent = 'Odlično! Nastavi tako!';
                porukaStatusa.style.color = '#28a745';
                porukaStatusa.style.borderColor = '#28a745';
            } else {
                // Pogrešan odgovor
                brojPogresnih++;
                pogresniRezultat.textContent = brojPogresnih;
                ukupanRezultat.textContent = brojTacnih - brojPogresnih;
                prikaziPovratnuInformaciju('✗ GREŠKA', 'pogresno');
                glavniKvadrat.classList.add('animacija-pogresno');
                porukaStatusa.textContent = `To je ${trenutnaBoja.ime}! Čekaj ${ciljnaBoja.ime}!`;
                porukaStatusa.style.color = '#dc3545';
                porukaStatusa.style.borderColor = '#dc3545';
            }
            
            // Ukloni CSS klase animacije nakon završetka
            setTimeout(() => {
                glavniKvadrat.classList.remove('animacija-tacno', 'animacija-pogresno');
            }, 500);
        }

        // Prikaži povratnu informaciju
        function prikaziPovratnuInformaciju(tekst, tip) {
            povratnaInformacija.textContent = tekst;
            povratnaInformacija.className = `povratna-informacija prikazi ${tip}`;
            
            setTimeout(() => {
                povratnaInformacija.className = 'povratna-informacija';
            }, 800);
        }

        // Event listener za klik na glavni kvadrat
        glavniKvadrat.addEventListener('click', proveriKlik);

        // Touch event za mobilne uređaje
        glavniKvadrat.addEventListener('touchend', (e) => {
            e.preventDefault();
            proveriKlik();
        });

        // Resetuj igru
        dugmeResetuj.addEventListener('click', () => {
            // Zaustavi trenutnu promenu boja
            zaustariPromehuBoja();
            
            // Resetuj rezultate
            brojTacnih = 0;
            brojPogresnih = 0;
            tacniRezultat.textContent = '0';
            pogresniRezultat.textContent = '0';
            ukupanRezultat.textContent = '0';
            porukaStatusa.textContent = 'Prati kvadrat i čekaj ciljnu boju!';
            porukaStatusa.style.color = '#333';
            porukaStatusa.style.borderColor = '#ddd';
            
            // Ponovo inicijalizuj igru sa novom nasumičnom ciljnom bojom
            inicirajIgru();
        });

        // Pokreni igru pri učitavanju stranice
        inicirajIgru();
        // Dugme za povratak na index.html
const dugmeNovaIgra = document.getElementById('dugmeNovaIgra');

dugmeNovaIgra.addEventListener('click', () => {
    window.location.href = 'index.html';
});
    </script>
</body>
</html>
